[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-cassandra-connector"
version = "1.0.0"
description = "Conector Ruvic de solo lectura para Apache Cassandra"
requires-python = ">=3.10"
dependencies = [
    "cassandra-driver>=3.29,<4.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_cassandra_connector*"]
